name: ShellCheck

on:
  push:
    paths:
      - '.dotfiles/**/*.sh'
  pull_request:
    paths:
      - '.dotfiles/**/*.sh'

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.dotfiles'
          severity: warning
